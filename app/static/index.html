<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Merchant Checker</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg:#f4f7fb; --surface:#fff; --soft:#f8fafc; --text:#172033; --muted:#5f6c80;
      --border:#d8e0ea; --primary:#3457d5; --primary-hover:#2947b5; --primary-soft:#eef2ff;
      --success:#147a46; --success-soft:#ebf8f1; --danger:#b4232c; --danger-soft:#fff0f1;
      --warning:#8a5a00; --warning-soft:#fff8e6; --shadow:0 18px 50px rgba(32,48,77,.1);
    }
    * { box-sizing:border-box; }
    body { min-width:320px; margin:0; background:var(--bg); color:var(--text); line-height:1.5; }
    button,input { font:inherit; }
    button,summary { -webkit-tap-highlight-color:transparent; }
    button:focus-visible,input:focus-visible,summary:focus-visible { outline:3px solid color-mix(in srgb,var(--primary) 45%,transparent); outline-offset:2px; }
    .shell { width:min(1080px,calc(100% - 32px)); margin:auto; }
    header { padding:56px 0 28px; text-align:center; }
    h1 { margin:0; font-size:clamp(2rem,6vw,3.4rem); letter-spacing:-.04em; line-height:1.05; }
    .subtitle { max-width:650px; margin:14px auto 10px; color:var(--muted); font-size:1.08rem; }
    .passive { display:inline-flex; align-items:center; gap:7px; margin:0; color:var(--success); font-size:.86rem; font-weight:700; }
    .passive::before { width:8px; height:8px; border-radius:50%; background:var(--success); content:""; }
    .scan-card { padding:clamp(20px,5vw,34px); border:1px solid var(--border); border-radius:20px; background:var(--surface); box-shadow:var(--shadow); }
    form { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; }
    .url-input { width:100%; min-width:0; padding:15px 17px; border:1px solid var(--border); border-radius:10px; background:var(--soft); color:var(--text); }
    .url-input::placeholder { color:var(--muted); }
    button { cursor:pointer; }
    .primary,.secondary,.chip { border:0; border-radius:10px; font-weight:700; }
    .primary { min-width:120px; padding:14px 20px; background:var(--primary); color:#fff; }
    .primary:hover:not(:disabled) { background:var(--primary-hover); }
    .primary:disabled { cursor:wait; opacity:.72; }
    .button-content { display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .progress-panel,#results { margin-top:24px; }
    .progress-panel { padding:20px; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
    .progress-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:10px; font-size:.9rem; font-weight:700; }
    .progress-track { height:8px; overflow:hidden; border-radius:999px; background:var(--border); }
    .progress-fill { width:0; height:100%; border-radius:inherit; background:var(--primary); transition:width .24s ease; }
    .progress-panel.failed .progress-fill { background:var(--danger); }
    .progress-panel.failed .progress-head { color:var(--danger); }
    #progress-log { display:grid; max-height:210px; margin:18px 0 0; padding:0; overflow:auto; list-style:none; gap:10px; }
    .step { display:grid; grid-template-columns:20px minmax(0,1fr); gap:9px; color:var(--muted); font-size:.88rem; }
    .step::before { display:grid; width:18px; height:18px; place-items:center; border:2px solid var(--border); border-radius:50%; content:""; }
    .step.current { color:var(--text); font-weight:650; }
    .step.current::before { border-color:var(--primary); border-top-color:transparent; animation:spin .8s linear infinite; }
    .step.complete::before { border-color:var(--success); background:var(--success); color:#fff; content:"✓"; font-size:.7rem; font-weight:900; }
    .step.failed { color:var(--danger); font-weight:650; }
    .step.failed::before { border-color:var(--danger); background:var(--danger); color:#fff; content:"×"; font-size:.76rem; font-weight:900; }
    .summary-strip { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:24px; overflow:hidden; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
    .summary-item { min-width:0; padding:15px 18px; border-right:1px solid var(--border); }
    .summary-item:last-child { border-right:0; }
    .summary-label { display:block; color:var(--muted); font-size:.72rem; font-weight:750; letter-spacing:.04em; text-transform:uppercase; }
    .summary-value { display:block; overflow:hidden; margin-top:3px; font-weight:750; text-overflow:ellipsis; white-space:nowrap; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:30px 0 12px; }
    .section-head h2 { margin:0; font-size:1.3rem; }
    .processor-grid,.mentions-grid,.checklist-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .processor-card,.mention-card { padding:18px; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
    .card-title { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .card-title h3,.mention-card h3 { margin:0; font-size:1.05rem; }
    .badge { flex:none; padding:4px 9px; border-radius:999px; font-size:.72rem; font-weight:800; text-transform:capitalize; }
    .badge.high { background:var(--success-soft); color:var(--success); }
    .badge.medium { background:var(--warning-soft); color:var(--warning); }
    .badge.low { background:var(--soft); color:var(--muted); }
    details { margin-top:12px; }
    summary { cursor:pointer; color:var(--primary); font-size:.9rem; font-weight:700; }
    .evidence-list { display:grid; margin:12px 0 0; padding:0; list-style:none; gap:10px; }
    .evidence-list li { padding:10px; border-radius:8px; background:var(--soft); font-size:.82rem; overflow-wrap:anywhere; }
    .evidence-label { display:block; font-weight:750; }
    .evidence-meta { display:block; margin-top:3px; color:var(--muted); }
    .possible { margin-top:28px; padding:20px; border:1px dashed var(--border); border-radius:14px; background:var(--soft); }
    .possible h2,.possible p { margin-top:0; }
    .possible p { color:var(--muted); font-size:.9rem; }
    .mention-card { background:color-mix(in srgb,var(--surface) 65%,transparent); }
    .checklist-item { margin:0; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
    .checklist-item summary { display:grid; grid-template-columns:24px minmax(0,1fr); align-items:center; gap:9px; padding:15px; color:var(--text); list-style:none; }
    .checklist-item summary::-webkit-details-marker { display:none; }
    .status-icon { display:grid; width:22px; height:22px; place-items:center; border-radius:50%; color:#fff; font-size:.75rem; font-weight:900; }
    .status-icon.pass { background:var(--success); } .status-icon.fail { background:var(--danger); }
    .checklist-body { padding:0 15px 15px 48px; }
    .not-found { margin:0; color:var(--muted); font-size:.86rem; }
    .empty,.error { padding:30px; border:1px solid var(--border); border-radius:14px; background:var(--surface); text-align:center; }
    .empty h2,.error h2 { margin:0 0 8px; font-size:1.15rem; }
    .empty p,.error p { max-width:620px; margin:auto; color:var(--muted); }
    .error { border-color:color-mix(in srgb,var(--danger) 35%,var(--border)); background:var(--danger-soft); }
    .secondary { padding:9px 13px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:.84rem; }
    .secondary:hover { border-color:var(--primary); color:var(--primary); }
    .copy-status { color:var(--success); font-size:.8rem; }
    footer { padding:32px 0 42px; color:var(--muted); text-align:center; font-size:.84rem; }
    [hidden] { display:none!important; }
    @media (max-width:720px) {
      header { padding-top:38px; } form,.processor-grid,.mentions-grid,.checklist-grid { grid-template-columns:1fr; }
      .primary { width:100%; } .summary-strip { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .summary-item:nth-child(2) { border-right:0; } .summary-item:nth-child(-n+2) { border-bottom:1px solid var(--border); }
      .section-head { align-items:flex-start; flex-direction:column; }
    }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#0d1320; --surface:#151d2c; --soft:#1b2536; --text:#edf2fa; --muted:#a7b3c5; --border:#334055;
        --primary:#8ca5ff; --primary-hover:#a9baff; --primary-soft:#202e59; --success:#66d69a; --success-soft:#173b2b;
        --danger:#ff8e97; --danger-soft:#3b2026; --warning:#f0c66b; --warning-soft:#3b321d; --shadow:0 18px 50px rgba(0,0,0,.3); }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before { transition:none!important; animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Merchant Checker</h1>
      <p class="subtitle">Inspect a public website for payment processors, commerce technology, and merchant-policy signals.</p>
      <p class="passive">Read-only, passive scan</p>
    </header>
    <main>
      <section class="scan-card" aria-labelledby="scan-heading">
        <h2 id="scan-heading" hidden>Start a scan</h2>
        <form id="scan-form">
          <label for="url" hidden>Website URL</label>
          <input id="url" class="url-input" name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://merchant.example" required>
          <button id="scan-button" class="primary" type="submit"><span class="button-content"><span id="button-label">Scan site</span></span></button>
        </form>
      </section>
      <section id="progress-panel" class="progress-panel" aria-labelledby="progress-title" hidden>
        <div class="progress-head"><span id="progress-title">Scan progress</span><span id="progress-percent">0%</span></div>
        <div class="progress-track" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill" class="progress-fill"></div></div>
        <ol id="progress-log" aria-live="polite"></ol>
      </section>
      <div id="results" aria-live="polite"></div>
    </main>
    <footer>Scans read public pages only. Page content is processed in memory and nothing is stored.</footer>
  </div>
  <script>
    const form=document.querySelector("#scan-form"),urlInput=document.querySelector("#url"),scanButton=document.querySelector("#scan-button"),buttonLabel=document.querySelector("#button-label"),progressPanel=document.querySelector("#progress-panel"),progressTrack=document.querySelector(".progress-track"),progressFill=document.querySelector("#progress-fill"),progressPercent=document.querySelector("#progress-percent"),progressLog=document.querySelector("#progress-log"),results=document.querySelector("#results");
    let lastScanResult=null,currentStep=null;
    function text(parent,tag,value,className){const element=document.createElement(tag);element.textContent=value;if(className)element.className=className;parent.appendChild(element);return element;}
    function setLoading(active){scanButton.disabled=active;urlInput.disabled=active;buttonLabel.textContent=active?"Scanning":"Scan site";const old=scanButton.querySelector(".spinner");if(active&&!old){const spinner=document.createElement("span");spinner.className="spinner";spinner.setAttribute("aria-hidden","true");scanButton.querySelector(".button-content").prepend(spinner);}else if(!active&&old)old.remove();}
    function updateProgress(value){const progress=Math.max(0,Math.min(100,value));progressFill.style.width=`${progress}%`;progressPercent.textContent=`${progress}%`;progressTrack.setAttribute("aria-valuenow",String(progress));}
    function addStep(message,final=false){if(currentStep){currentStep.classList.remove("current");currentStep.classList.add("complete");}const step=text(progressLog,"li",message,"step");if(final){step.classList.add("complete");currentStep=null;}else{step.classList.add("current");currentStep=step;}progressLog.scrollTop=progressLog.scrollHeight;}
    function failStep(message){progressPanel.classList.add("failed");if(currentStep){currentStep.classList.remove("current");currentStep.classList.add("failed");currentStep.textContent=`${currentStep.textContent}: ${message}`;}else{text(progressLog,"li",message,"step failed");}currentStep=null;progressLog.scrollTop=progressLog.scrollHeight;}
    function evidenceDetails(evidence,label){const details=document.createElement("details"),summary=text(details,"summary",label),list=document.createElement("ul");summary.setAttribute("aria-label",`${label}, ${evidence.length} items`);list.className="evidence-list";for(const item of evidence){const row=document.createElement("li");text(row,"span",item.label,"evidence-label");text(row,"span",`${item.signal_type?item.signal_type+": ":""}${item.matched_value}`,"evidence-meta");text(row,"span",`Source: ${item.source_page}`,"evidence-meta");list.appendChild(row);}details.appendChild(list);return details;}
    function processorCard(processor){const card=document.createElement("article"),title=document.createElement("div");card.className="processor-card";title.className="card-title";text(title,"h3",processor.name);text(title,"span",processor.confidence,`badge ${processor.confidence}`);card.append(title,evidenceDetails(processor.evidence,"Why we think this"));return card;}
    function checklistItem(item){const details=document.createElement("details"),summary=document.createElement("summary"),body=document.createElement("div");details.className="checklist-item";text(summary,"span",item.passed?"✓":"×",`status-icon ${item.passed?"pass":"fail"}`);text(summary,"span",`${item.name}: ${item.passed?"Found":"Not found"}`);body.className="checklist-body";if(item.evidence.length)body.appendChild(evidenceDetails(item.evidence,"View evidence"));else text(body,"p","Not found in the pages checked.","not-found");details.append(summary,body);return details;}
    function sectionHead(parent,title,copy=false){const head=document.createElement("div");head.className="section-head";text(head,"h2",title);if(copy){const controls=document.createElement("div"),button=text(controls,"button","Copy results as JSON","secondary"),status=text(controls,"span","","copy-status");button.type="button";button.addEventListener("click",async()=>{if(!lastScanResult)return;try{await navigator.clipboard.writeText(JSON.stringify(lastScanResult,null,2));status.textContent=" Copied";setTimeout(()=>status.textContent="",1800);}catch{status.textContent=" Copy failed";}});head.appendChild(controls);}parent.appendChild(head);}
    function summary(parent,result,pages,seconds){const strip=document.createElement("section");strip.className="summary-strip";strip.setAttribute("aria-label","Scan summary");for(const [label,value] of [["Domain",new URL(result.url).hostname],["Pages checked",String(pages)],["Time taken",`${seconds.toFixed(1)}s`],["Confirmed",String(result.processors.length)]]){const item=document.createElement("div");item.className="summary-item";text(item,"span",label,"summary-label");const output=text(item,"span",value,"summary-value");output.title=value;strip.appendChild(item);}parent.appendChild(strip);}
    function showResult(result,pages,seconds){lastScanResult=result;results.replaceChildren();summary(results,result,pages,seconds);sectionHead(results,"Confirmed processors",true);if(!result.processors.length){const empty=document.createElement("section");empty.className="empty";text(empty,"h2","No confirmed processors found");text(empty,"p","No client-side signals found; the processor may be server-side or redirect-based.");results.appendChild(empty);}else{const grid=document.createElement("div");grid.className="processor-grid";for(const processor of result.processors)grid.appendChild(processorCard(processor));results.appendChild(grid);}if(result.possible_mentions.length){const possible=document.createElement("section"),grid=document.createElement("div");possible.className="possible";grid.className="mentions-grid";text(possible,"h2","Possible mentions");text(possible,"p","These are weak signals and are not confirmed payment integrations.");for(const processor of result.possible_mentions){const card=document.createElement("article"),title=document.createElement("div");card.className="mention-card";title.className="card-title";text(title,"h3",processor.name);text(title,"span","Low confidence","badge low");card.append(title,evidenceDetails(processor.evidence,"View weak evidence"));grid.appendChild(card);}possible.appendChild(grid);results.appendChild(possible);}sectionHead(results,"Merchant checklist");const checklist=document.createElement("section");checklist.className="checklist-grid";for(const item of result.checklist)checklist.appendChild(checklistItem(item));results.appendChild(checklist);}
    function showError(message,category=null){results.replaceChildren();let title="Scan failed",normalized=message.toLowerCase();if(category==="blocked_by_site")title="Blocked by the site";else if(normalized.includes("not allowed")||normalized.includes("only http"))title="Blocked URL";else if(normalized.includes("limit")||normalized.includes("busy"))title="Scan temporarily limited";else if(normalized.includes("reach")||normalized.includes("timeout")||normalized.includes("respond"))title="Site unreachable";const card=document.createElement("section");card.className="error";text(card,"h2",title);text(card,"p",message);results.appendChild(card);}
    form.addEventListener("submit",async event=>{event.preventDefault();lastScanResult=null;currentStep=null;progressLog.replaceChildren();results.replaceChildren();progressPanel.classList.remove("failed");progressPanel.hidden=false;updateProgress(0);setLoading(true);const started=performance.now(),pages=new Set();try{const response=await fetch("/api/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:urlInput.value})});if(!response.ok){const body=await response.json();throw new Error(body.detail||"The scan could not be started.");}if(!response.body)throw new Error("The browser could not read the progress stream.");const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="";while(true){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});const blocks=buffer.split("\n\n");buffer=blocks.pop()||"";for(const block of blocks){const data=block.split("\n").filter(line=>line.startsWith("data:")).map(line=>line.slice(5).trimStart()).join("\n");if(!data)continue;const scanEvent=JSON.parse(data),prefix="Analyzing scripts and page signals on ";updateProgress(scanEvent.progress);if(scanEvent.event==="error"){failStep(scanEvent.message);showError(scanEvent.message,scanEvent.error_category);}else{addStep(scanEvent.message,scanEvent.event==="result");if(scanEvent.event==="result")showResult(scanEvent.result,pages.size,(performance.now()-started)/1000);}if(scanEvent.message.startsWith(prefix))pages.add(scanEvent.message.slice(prefix.length));}if(done)break;}}catch(error){failStep(error.message);showError(error.message);}finally{setLoading(false);}});
  </script>
</body>
</html>
